name: Drift Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - 'week4/data/**'
      - 'week4/scripts/**'
      - '.github/workflows/monitor-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scipy scikit-learn pytest

      - name: Compute monitoring metrics
        id: metrics
        run: |
          cd week4
          python3 scripts/compute_metrics.py \
            --baseline data/jan_1_15_baseline.csv \
            --new data/feb_2_28_current.csv \
            --output metrics-monitoring.json

      - name: Detect drift patterns
        id: drift
        run: |
          cd week4
          python3 scripts/detect_drift.py \
            --baseline data/jan_1_15_baseline.csv \
            --new data/feb_2_28_current.csv \
            --output drift_report.json

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            week4/metrics-monitoring.json
            week4/drift_report.json

      - name: Create alert if drift detected
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Drift detected in monitoring',
              body: 'Monitoring workflow detected data or concept drift. Check logs and uploaded monitoring reports for details.',
              labels: ['drift-alert']
            })

      - name: Monitoring complete
        if: success()
        run: echo "Drift monitoring complete. No issues detected."
